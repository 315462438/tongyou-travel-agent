<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #F7F3EA; }
    .kai { font-family: 'STKaiti','KaiTi','楷体','Songti SC','Noto Serif SC',serif; }
    a { color: #3F6B52; } a:hover { color: #2C4C39; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F3EA; color: #241F1B; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', system-ui, sans-serif; overflow: hidden;">

  <!-- 顶栏 -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 10px;">
    <div style="display: flex; align-items: center; gap: 9px;">
      <div style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; background: #B23A2F; transform: rotate(-6deg);">
        <span class="kai" style="font-size: 15px; font-weight: 700; color: #FBF8F1;">游</span>
      </div>
      <span class="kai" style="font-size: 19px; font-weight: 700; letter-spacing: 2px; color: #3F6B52;">行记</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#241F1B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.5 7.5-2.5 7.5h17S18 15 18 8.5z"/><path d="M10.3 19.5a2 2 0 0 0 3.4 0"/></svg>
        <span style="position: absolute; top: 8px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: #B23A2F; color: #FBF8F1; font-size: 11px; font-weight: 700; line-height: 16px; text-align: center;">3</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;">
        <div style="width: 30px; height: 30px; border-radius: 999px; background: #E3DCC7; border: 1px solid #CDBF9C;"></div>
      </div>
    </div>
  </div>

  <!-- 主体 -->
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 0;">

    <div>
      <div class="kai" style="font-size: 34px; font-weight: 700; letter-spacing: 3px; line-height: 1.15; color: #241F1B;">今天想去哪儿</div>
      <div style="margin-top: 10px; font-size: 13px; color: #6A6046; line-height: 1.7;">说个地方、发张截图，或者贴条小红书链接<br>剩下的交给我去查</div>
    </div>

    <!-- 输入卡 -->
    <div style="border-radius: 16px; background: #FFFEFB; border: 1px solid #E3DCC7; box-shadow: 0 3px 14px rgba(90,78,50,.08);">
      <div style="padding: 16px 16px 4px; font-size: 16px; line-height: 1.6; color: #9C8F6F;">十一想去成都玩四天，两个人，预算六千</div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 12px;">
        <div style="display: flex; align-items: center; gap: 4px;">
          <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#6A6046" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m3.5 17 5-4.5 4 3.5 3-2.5 5 4"/></svg>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #CDBF9C; background: #F7F3EA;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3F6B52" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c-3 3-3 6 0 9s3 6 0 8"/><circle cx="12" cy="12" r="9"/></svg>
            <span style="font-size: 12px; font-weight: 600; color: #3F6B52;">深度推理</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; background: #3F6B52;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FBF8F1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>
        </div>
      </div>
    </div>

    <!-- 热门目的地 -->
    <div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px;">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #6A6046;">最近大家在问</span>
        <span style="font-size: 11px; color: #9C8F6F;">近 30 天</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">

        <div style="border-radius: 12px; overflow: hidden; background: #FFFEFB; border: 1px solid #E3DCC7;">
          <div style="position: relative; height: 82px; background: linear-gradient(150deg, #6F8F76, #3F6B52);">
            <span class="kai" style="position: absolute; left: 12px; bottom: 9px; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #FBF8F1;">杭州</span>
          </div>
          <div style="padding: 9px 12px 11px; font-size: 11px; color: #6A6046; line-height: 1.6;">西湖 · 龙井 · 良渚<br><span style="color: #9C8F6F;">42 人问过</span></div>
        </div>

        <div style="border-radius: 12px; overflow: hidden; background: #FFFEFB; border: 1px solid #E3DCC7;">
          <div style="position: relative; height: 82px; background: linear-gradient(150deg, #C88A6A, #C2603E);">
            <span class="kai" style="position: absolute; left: 12px; bottom: 9px; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #FBF8F1;">成都</span>
          </div>
          <div style="padding: 9px 12px 11px; font-size: 11px; color: #6A6046; line-height: 1.6;">熊猫 · 火锅 · 青城山<br><span style="color: #9C8F6F;">38 人问过</span></div>
        </div>

        <div style="border-radius: 12px; overflow: hidden; background: #FFFEFB; border: 1px solid #E3DCC7;">
          <div style="position: relative; height: 82px; background: linear-gradient(150deg, #7A9EB8, #3C6E8F);">
            <span class="kai" style="position: absolute; left: 12px; bottom: 9px; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #FBF8F1;">大理</span>
          </div>
          <div style="padding: 9px 12px 11px; font-size: 11px; color: #6A6046; line-height: 1.6;">洱海 · 苍山 · 喜洲<br><span style="color: #9C8F6F;">31 人问过</span></div>
        </div>

        <div style="border-radius: 12px; overflow: hidden; background: #FFFEFB; border: 1px solid #E3DCC7;">
          <div style="position: relative; height: 82px; background: linear-gradient(150deg, #C4A56A, #A8843C);">
            <span class="kai" style="position: absolute; left: 12px; bottom: 9px; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #FBF8F1;">西安</span>
          </div>
          <div style="padding: 9px 12px 11px; font-size: 11px; color: #6A6046; line-height: 1.6;">兵马俑 · 城墙 · 回民街<br><span style="color: #9C8F6F;">27 人问过</span></div>
        </div>

      </div>
    </div>
  </div>

  <!-- 底栏 -->
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #241F1B; padding: 8px 8px 22px; border-radius: 20px 20px 0 0;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#F7F3EA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg>
      <span style="font-size: 11px; font-weight: 700; color: #F7F3EA;">新对话</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8C8378" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 7 9 4z"/><path d="M9 4v13M15 7v12.5"/></svg>
      <span style="font-size: 11px; color: #8C8378;">行程</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8C8378" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <span style="font-size: 11px; color: #8C8378;">历史</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#8C8378" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="3.2"/><path d="M3.5 19c.6-3.1 2.8-4.8 5.5-4.8s4.9 1.7 5.5 4.8"/><path d="M16.5 6.6a3 3 0 0 1 0 5.4M18.6 14.6c1.6.8 2.7 2.3 3 4.4"/></svg>
      <span style="font-size: 11px; color: #8C8378;">同游圈</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
