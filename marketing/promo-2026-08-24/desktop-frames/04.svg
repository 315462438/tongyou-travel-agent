<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f7ff"/><stop offset=".48" stop-color="#eef7fb"/><stop offset="1" stop-color="#f4efff"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7164f5"/><stop offset="1" stop-color="#39c5aa"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#353b73" flood-opacity=".14"/></filter><clipPath id="heroClip"><rect x="0" y="0" width="100%" height="100%" rx="20"/></clipPath></defs><style>text{font-family:'Hiragino Sans GB','PingFang SC','Microsoft YaHei',sans-serif;fill:#182033}.brand{font-size:24px;font-weight:800}.strong{font-size:22px;font-weight:750}.body{font-size:19px}.small{font-size:16px}.tiny{font-size:14px}.micro{font-size:12px;fill:#848ba0}.caption{font-size:35px;font-weight:800}.white{fill:#fff}.center{text-anchor:middle}</style><rect width="1920" height="1080" fill="url(#pageBg)"/><rect width="286" height="980" fill="#f8f9fd"/><g transform="translate(28 24)"><g transform="translate(0 0) scale(1)" fill="none" stroke="#7063f4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="33.5" r="3.5" fill="#7063f4" stroke="none"/><path d="M14.2 32.7c4.3-8 9.2 1.8 14.3-7 2.7-4.7 5.5-6.7 9-7.3" stroke-width="3.6"/><path d="m31.7 13.8 7.8 3.6-5.4 6.8" stroke-width="3.6"/><circle cx="10.5" cy="33.5" r="6.3" opacity=".3" stroke-width="1.7"/></g><text x="58" y="32" class="brand">17同游</text></g><rect x="22" y="86" width="242" height="50" rx="16" fill="#171a27"/><text x="143" y="118" class="small white center">＋ 新对话</text><text x="28" y="177" class="micro">最近对话</text><rect x="18" y="194" width="250" height="46" rx="13" fill="#eceaff"/><text x="34" y="224" class="tiny" fill="#5d51dc">马来西亚 5 天潜水之旅</text><rect x="18" y="248" width="250" height="46" rx="13" fill="transparent"/><text x="34" y="278" class="tiny" fill="#61697f">成都 3 天轻松路线</text><rect x="18" y="302" width="250" height="46" rx="13" fill="transparent"/><text x="34" y="332" class="tiny" fill="#61697f">天堂寨旅行预演</text><g transform="translate(18 732)"><rect y="0" width="250" height="46" rx="13" fill="#eceaff"/><text x="18" y="29" class="small" fill="#5d51dc">✦  新对话</text><rect y="55" width="250" height="46" rx="13" fill="transparent"/><text x="18" y="84" class="small" fill="#626a7e">⌁  同游圈</text><rect y="110" width="250" height="46" rx="13" fill="transparent"/><text x="18" y="139" class="small" fill="#626a7e">▣  协同行程</text><rect y="165" width="250" height="46" rx="13" fill="transparent"/><text x="18" y="194" class="small" fill="#626a7e">◇  记忆</text></g><circle cx="48" cy="952" r="20" fill="#d8d3ff"/><text x="48" y="960" class="small center" fill="#5d51dc">A</text><text x="80" y="958" class="tiny">admin</text><rect x="286" width="1634" height="74" fill="#fff"/><line x1="286" y1="74" x2="1920" y2="74" stroke="#e8eaf2"/><text x="326" y="45" class="strong">开始新旅程</text><rect x="1602" y="18" width="252" height="40" rx="20" fill="#f3f4f8"/><rect x="1608" y="23" width="116" height="30" rx="15" fill="#fff"/><text x="1666" y="44" class="micro center">▱ 网页端</text><text x="1787" y="44" class="micro center">▯ 移动端</text><g transform="translate(286 74)"><text x="817" y="116" class="small center" fill="#6659e8">17同游 · 一起规划，一起出发</text><text x="817" y="186" class="center" font-size="52" font-weight="800">想去哪儿，就从这里出发</text><text x="817" y="226" class="small center" fill="#7c8398">说一个目的地、贴一篇攻略，或者直接问我旅行问题。</text><rect x="288" y="268" width="1058" height="438" rx="34" fill="#fff" filter="url(#shadow)"/><text x="330" y="318" class="tiny">今天想从哪里开始？</text><rect x="326" y="342" width="982" height="118" rx="24" fill="#fbfcff" stroke="#dfe3ee" stroke-width="2"/><text x="358" y="392" class="body" fill="#20283c">国庆想和朋友去马来西亚玩 5 天，喜欢潜水，预算 8000 元</text><rect x="980" y="370" width="3" height="32" fill="#6f63f6"/><g transform="translate(326 494)"><rect x="0" width="228" height="84" rx="20" fill="#f5f6fa"/><text x="22" y="31" class="micro">出发地</text><text x="22" y="61" class="strong">上海</text><rect x="248" width="228" height="84" rx="20" fill="#f5f6fa"/><text x="270" y="31" class="micro">天数</text><text x="270" y="61" class="strong">5 天</text><rect x="496" width="228" height="84" rx="20" fill="#f5f6fa"/><text x="518" y="31" class="micro">预算</text><text x="518" y="61" class="strong">¥ 8000</text><rect x="744" width="228" height="84" rx="20" fill="#f5f6fa"/><text x="766" y="31" class="micro">节奏</text><text x="766" y="61" class="strong">松弛一点</text></g><text x="326" y="628" class="tiny" fill="#838ba0">会检查路线、节奏、预算和备选方案</text><rect x="1038" y="606" width="270" height="66" rx="33" fill="#1b1d28"/><text x="1173" y="648" class="strong white center">开始规划  →</text></g><defs><linearGradient id="captionBg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#171b36" stop-opacity=".98"/><stop offset="1" stop-color="#30256c" stop-opacity=".96"/></linearGradient></defs><rect y="930" width="1920" height="150" fill="url(#captionBg)"/><text x="68" y="980" class="micro white" opacity=".72">01 / 05</text><text x="68" y="1034" class="caption white">预算、偏好一起说清</text><text x="1852" y="1020" class="small white" text-anchor="end" opacity=".78">减少反复沟通</text></svg>