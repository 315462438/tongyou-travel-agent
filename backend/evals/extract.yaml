# 本体抽取评估集（2026-08-14）
#
# 为什么单独立一个集：`app/ontology/extract.py` 是**全系统唯一**一处从攻略正文抽结构，
# 海报 / 预算 / 行程导入三个消费端全挂在它下面——抽歪一次，三处一起歪。
# 而 `tests/test_ontology.py` 那 41 条**全是 mock 掉 LLM 的**，测的是投影与缓存失效，
# 没有一条在测「真模型抽得准不准」。
#
# 和 `queries.yaml` 的分工：
#   queries.yaml  端到端跑真实流水线（含浏览器），一轮约 1 小时 → 大改动前后的对照闸门
#   extract.yaml  输入是**固定的攻略正文**，只调抽取那一步 → 秒级、几分钱，可以常跑
#
# 样本文件不进 git，跑之前先 `python -m evals.fetch_samples` 拉下来（会校验 sha256）。
#
# 字段：
#   id             样本名，对应 samples/{id}.md
#   message_id     线上 travel_message.id（fetch_samples 按它拉）
#   sha256         正文哈希前 16 位，防样本悄悄漂移
#   days           正文里实际存在的 Day 编号——抽取结果必须**逐日覆盖**
#   must_stops     必须被抽成 stop 的地标（子串匹配；每个都是正文里的加粗主项）
#   expect_headcount  预算口径的人数。**这是最容易错的一项**：多数攻略的预算表写的是
#                  「两人合计」，抽取要认出人数，否则下游按人均展示会翻倍
#   expects_cost   预算表存在时必须抽出开销条目
#   note           这条样本是为了守住什么

- id: tiantangzhai_3d_short
  message_id: 0fbcdc73bcea4a48af916ab2f4276251
  sha256: 5e886deca1c93967
  days: [1, 2, 3]
  must_stops: [天堂寨, 白马大峡谷]
  # 0 = 不检查人数。**这条正文没有有效的 ground truth**：表头写「人均」，只有住宿一行
  # 提到「两人分摊」，全文没说同行几人。实测同一份正文抽出的 headcount 在 1 和 2 之间
  # 反复横跳（2→1→2→1），因为它本来就没有唯一答案。
  # 拿它当断言只会得到一道**随机红灯**——闸门一旦会随机变红，人就开始忽略它，
  # 比没有闸门更糟。人数这项由另外 4 条守（两人/两大一小/两人合计都是正文明写的）。
  # 顺带记下这个发现：正文不写同行人数时，headcount 抽取是不稳的，而 budget 的
  # group_total = 人均 × headcount —— 这类攻略的团组总额实际上是抛硬币。
  expect_headcount: 0
  expects_cost: true
  note: 最短样本（3.8k 字）。守单次调用路径与最短正文下的逐日覆盖。

